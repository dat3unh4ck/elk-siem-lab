services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?define ELASTIC_PASSWORD en el fichero .env}
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elk
    healthcheck:
      # $$ escapa la interpolacion de Compose: la variable se resuelve dentro del contenedor,
      # asi la contrasena no queda escrita en el fichero ni en `docker inspect` del healthcheck.
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?define ELASTIC_PASSWORD en el fichero .env}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    environment:
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?define KIBANA_SYSTEM_PASSWORD en el fichero .env}
      - ENCRYPTION_KEY_SAVED_OBJECTS=${ENCRYPTION_KEY_SAVED_OBJECTS:?define ENCRYPTION_KEY_SAVED_OBJECTS en el fichero .env}
      - ENCRYPTION_KEY_SECURITY=${ENCRYPTION_KEY_SECURITY:?define ENCRYPTION_KEY_SECURITY en el fichero .env}
      - ENCRYPTION_KEY_REPORTING=${ENCRYPTION_KEY_REPORTING:?define ENCRYPTION_KEY_REPORTING en el fichero .env}
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: filebeat
    user: root
    # --strict.perms=false es necesario en macOS: Docker monta los ficheros con
    # permisos que Filebeat rechaza por defecto.
    entrypoint: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${HOST_LOG_DIR:-/var/log}:/var/log/host:ro
    depends_on:
      - logstash
    networks:
      - elk

volumes:
  es_data:

networks:
  elk:
    driver: bridge
