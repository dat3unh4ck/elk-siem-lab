input {
  beats {
    port => 5044
  }
}

filter {
  # Etapa 1 — Parsing Grok: descompone la linea syslog en campos estructurados.
  grok {
    match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:hostname} %{DATA:process}\[%{NUMBER:pid}\]: %{GREEDYDATA:log_message}" }
    tag_on_failure => ["_grok_parse_failure"]
  }

  # Etapa 2 — Normalizacion temporal: el timestamp del log pasa a ser @timestamp.
  if "_grok_parse_failure" not in [tags] {
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      target => "@timestamp"
    }
  }

  # Etapa 3 — Categorizacion por proceso emisor.
  if [process] {
    mutate {
      add_field => { "categoria" => "%{process}" }
    }
  }

  # Etapa 4 — Extraccion de la IP implicada en el evento.
  if [log_message] {
    grok {
      match => { "log_message" => "(?:from|to|connection.*to|detected from|attempt.*from) %{IP:alert_ip}" }
      tag_on_failure => ["_no_ip_found"]
    }
  }

  # Etapa 5 — Enriquecimiento GeoIP (solo resuelve para IPs publicas).
  if [alert_ip] {
    geoip {
      source => "alert_ip"
      target => "geoip"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }

  # Etapa 6 — Clasificacion automatica de severidad.
  if [log_message] {
    if [log_message] =~ /(?i)(ALERT|CRITICAL|EMERGENCY|unauthorized|port scan)/ {
      mutate { add_field => { "severidad" => "critica" } }
    } else if [log_message] =~ /(?i)(error|fail|denied|refused|rejected)/ {
      mutate { add_field => { "severidad" => "alta" } }
    } else if [log_message] =~ /(?i)(warn|warning|timeout|retry)/ {
      mutate { add_field => { "severidad" => "media" } }
    } else {
      mutate { add_field => { "severidad" => "info" } }
    }
  }

  # Etapa 7 — Limpieza de campos ya normalizados.
  mutate {
    remove_field => [ "syslog_timestamp" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "macos-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
}
