title: Conexion C2 - Comunicacion saliente sospechosa
id: c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f
status: experimental
description: Detecta conexiones salientes a IPs potencialmente maliciosas, indicativo de comunicacion con un servidor de Command and Control.
author: Jonathas - Date Un H4ck
date: 2026/05/17
references:
  - https://attack.mitre.org/techniques/T1071/
logsource:
  category: syslog
  product: macos
detection:
  selection:
    log_message|contains: "Suspicious outbound connection"
  condition: selection
falsepositives:
  - Conexiones legitimas a servicios externos
  - VPNs corporativas
level: critical
tags:
  - attack.command_and_control
  - attack.t1071
